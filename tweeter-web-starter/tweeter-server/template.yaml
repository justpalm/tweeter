Outputs:
  ProfileImageBucketName:
    Description: Profile photo bucket for registration and owned live-test fixtures
    Value: !Ref ProfileImageBucket

  StoryTableName:
    Description: Persisted author stories
    Value: !Ref StoryTable
  FeedTableName:
    Description: Precomputed follower feeds
    Value: !Ref FeedTable
