  #
  # SQS Queues  (This will become relevant in Milestone 4. For M3, leave this section commented out.)
  #

  #   MyQueue:
  #     Type: AWS::SQS::Queue
  #     Properties:
  #       QueueName: MyQueue


  #
  # Lambda Layer (reused by all Lambda functions)
  #
  tweeterLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: tweeterLayer
      Description: dependencies layer for Tweeter server
      ContentUri: ./layer/
      CompatibleRuntimes:
        - nodejs24.x
      RetentionPolicy: DELETE


  #
  # Web API Lambda functions
  #

  PostStatusLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: PostStatusLambda
      Handler: lambda/status/PostStatusLambda.handler
      Policies: *commonPolicies
      Events:
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /lambda/status/post
            Method: POST

  LoadMoreFeedItemsLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: LoadMoreFeedItemsLambda
      Handler: lambda/status/LoadMoreFeedItemsLambda.handler
      Policies: *commonPolicies
      Events:
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /lambda/feed/list
            Method: POST

  LoadMoreStoryItemsLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: LoadMoreStoryItemsLambda
      Handler: lambda/status/LoadMoreStoryItemsLambda.handler
      Policies: *commonPolicies
      Events:
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /lambda/story/list
            Method: POST

  GetUserLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetUserLambda
      Handler: lambda/user/GetUserLambda.handler
      Policies: *commonPolicies
      Events:
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /lambda/user/get
            Method: POST

  LogoutLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: LogoutLambda
      Handler: lambda/user/LogoutLambda.handler
      Policies: *commonPolicies
      Events:
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /lambda/logout
            Method: POST

  LoginLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: LoginLambda
      Handler: lambda/user/LoginLambda.handler
      Policies: *commonPolicies
      Events:
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /lambda/login
            Method: POST

  RegisterLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: RegisterLambda
      Handler: lambda/user/RegisterLambda.handler
      Policies: *commonPolicies
      # AI-assisted: see AI-ATTRIBUTION.md
      Environment:
        Variables:
          PROFILE_IMAGE_BUCKET_NAME: !Ref ProfileImageBucket
      Events:
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /lambda/register
            Method: POST

  UnfollowLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: UnfollowLambda
      Handler: lambda/follow/UnfollowLambda.handler
      Policies: *commonPolicies
      Events:
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /lambda/unfollow
            Method: POST

  FollowLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: FollowLambda
      Handler: lambda/follow/FollowLambda.handler
      Policies: *commonPolicies
      Events:
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /lambda/follow
            Method: POST

  IsFollowingLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: IsFollowingLambda
      Handler: lambda/follow/IsFollowingLambda.handler
      Policies: *commonPolicies
      Events:
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /lambda/follow/is-following
            Method: POST

  GetFolloweesLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetFolloweesLambda
      Handler: lambda/follow/GetFolloweesLambda.handler
      Policies: *commonPolicies
      Events:
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /lambda/followees/list
            Method: POST

  GetFollowersLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetFollowersLambda
      Handler: lambda/follow/GetFollowersLambda.handler
      Policies: *commonPolicies
      Events:
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /lambda/followers/list
            Method: POST

  GetFolloweeCountLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetFolloweeCountLambda
      Handler: lambda/follow/GetFolloweeCountLambda.handler
      Policies: *commonPolicies
      Events:
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /lambda/followees/count
            Method: POST

  GetFollowerCountLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetFollowerCountLambda
      Handler: lambda/follow/GetFollowerCountLambda.handler
      Policies: *commonPolicies
      Events:
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref tweeterApi
            Path: /lambda/followers/count
            Method: POST

