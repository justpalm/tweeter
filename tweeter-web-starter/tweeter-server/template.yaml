  #
  # DynamoDB Tables
  #

  # AI-assisted: see AI-ATTRIBUTION.md
  # Dedicated photo storage, separate from the SAM deployment artifact bucket.
  ProfileImageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  ProfileImageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ProfileImageBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicProfileImageRead
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${ProfileImageBucket.Arn}/profile-images/*"

  # User accounts; DynamoDB stores non-key profile fields with each item.
  UserTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: alias
          AttributeType: S
      KeySchema:
        - AttributeName: alias
          KeyType: HASH
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1

  # Sessions; userAlias and lastActiveTimestamp are non-key item attributes.
  AuthTokenTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: token
          AttributeType: S
      KeySchema:
        - AttributeName: token
          KeyType: HASH
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1

  # AI-assisted: see AI-ATTRIBUTION.md. Proposed resources; created only on deployment.
  StoryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AttributeDefinitions:
        - AttributeName: owner_alias
          AttributeType: S
        - AttributeName: status_key
          AttributeType: S
      KeySchema:
        - AttributeName: owner_alias
          KeyType: HASH
        - AttributeName: status_key
          KeyType: RANGE
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1

  FeedTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AttributeDefinitions:
        - AttributeName: owner_alias
          AttributeType: S
        - AttributeName: status_key
          AttributeType: S
      KeySchema:
        - AttributeName: owner_alias
          KeyType: HASH
        - AttributeName: status_key
          KeyType: RANGE
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1

