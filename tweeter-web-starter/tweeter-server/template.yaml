AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SAM config for Tweeter server

# AI-assisted: reuse the existing exercise table/index; do not create replacements.
Parameters:
  FollowTableName:
    Type: String
    Default: follows
  FollowIndexName:
    Type: String
    Default: follows_index


#
# Global Lambda function properties. These apply to every Lambda function.
#
Globals:
  Function:
    Runtime: nodejs24.x
    CodeUri: ./dist/
    Layers:
      - !Ref tweeterLayer
    Timeout: 30
    MemorySize: 128
    Environment:
      Variables:
        USER_TABLE_NAME: !Ref UserTable
        AUTH_TOKEN_TABLE_NAME: !Ref AuthTokenTable
        FOLLOW_TABLE_NAME: !Ref FollowTableName
        FOLLOW_INDEX_NAME: !Ref FollowIndexName
        STORY_TABLE_NAME: !Ref StoryTable
        FEED_TABLE_NAME: !Ref FeedTable


#
# Reusable blocks of configuration. These are referenced throughout the template to avoid duplication.
# &identifier is used to define a reusable block, and *identifier is used to reference it.
#
Metadata:
  x-common-policies: &commonPolicies
    - AWSLambdaBasicExecutionRole
    - AmazonSESFullAccess
    - CloudWatchFullAccess
    - AmazonDynamoDBFullAccess
    - AmazonS3FullAccess
    - AmazonSQSFullAccess

  x-common-cors-headers: &commonCorsHeaders
    method.response.header.Access-Control-Allow-Origin: "'*'"

  x-common-swagger-response-headers: &commonSwaggerResponseHeaders
    Access-Control-Allow-Origin:
      type: string


#
# AWS resource definitions
#
Resources:


  #
  # Web API
  #

  tweeterApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: tweeterApi
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE'"
        AllowHeaders: "'*'"
        AllowOrigin: "'*'"
      DefinitionBody:
        swagger: "2.0"
        info:
          title: "Tweeter API"
          version: "1.0"
        x-common-consumes: &commonConsumes
          - application/json
        x-common-produces: &commonProduces
          - application/json
        x-common-request-templates: &commonRequestTemplates
          application/json: $input.json('$')
        x-common-amazon-responses: &commonAmazonResponses
          default:
            statusCode: 200
            responseParameters: *commonCorsHeaders
          ".*bad-request.*":
            statusCode: 400
            responseParameters: *commonCorsHeaders
            responseTemplates:
              application/json: '{ "error": "$input.path(''$.errorMessage'')" }'
          ".*unauthorized.*":
            statusCode: 401
            responseParameters: *commonCorsHeaders
            responseTemplates:
              application/json: '{ "error": "$input.path(''$.errorMessage'')" }'
          ".*internal-server-error.*":
            statusCode: 500
            responseParameters: *commonCorsHeaders
            responseTemplates:
              application/json: '{ "error": "$input.path(''$.errorMessage'')" }'
        x-common-swagger-responses: &commonSwaggerResponses
          "200":
            description: "OK"
            headers: *commonSwaggerResponseHeaders
          "400":
            description: "Invalid request input; returns an error message prefixed bad-request:"
            headers: *commonSwaggerResponseHeaders
          "401":
            description: "Unauthorized"
            headers: *commonSwaggerResponseHeaders
          "500":
            description: "Internal Server Error"
            headers: *commonSwaggerResponseHeaders
        paths:

          #
          # Endpoint definitions
          #

          /lambda/status/post:
            post:
              description: Authenticates the stored session, saves a status in the session owner's story, and materializes current followers' feeds before acknowledging. Author profile and posting timestamp come from the server. Existing newStatus DTO and success/message response are preserved. Partial delivery can persist some copies before an error; a repeated HTTP submission is a new post.
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PostStatusLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

          /lambda/feed/list:
            post:
              description: Authenticated newest-first persisted feed page. The requested userAlias must match the session owner. Uses pageSize (1-100) and lastItem (StatusDto or explicit null). Returns status DTO items and hasMore. Cursor author/timestamp exclusively identify the boundary, including ties between authors. Does not merge stories on read.
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LoadMoreFeedItemsLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

          /lambda/story/list:
            post:
              description: Authenticated newest-first persisted story page for the requested author. Uses token, userAlias, pageSize (1-100), and lastItem (StatusDto or explicit null). Returns status DTO items and hasMore. A story cursor must belong to the requested author. No dummy statuses.
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LoadMoreStoryItemsLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

          /lambda/user/get:
            post:
              description: Gets a public user profile by alias after validating the active server-stored session. Returns success, message, and a user DTO or null when the alias is unknown. Required request fields must be nonblank strings; invalid input returns HTTP 400 and missing or expired sessions return HTTP 401.
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetUserLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

          /lambda/logout:
            post:
              description: Deletes the server-stored session for an active token and returns success and message. The client clears local sign-in state even when the server rejects an expired token. Required request fields must be nonblank strings; invalid input returns HTTP 400 and missing or expired sessions return HTTP 401.
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LogoutLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

          /lambda/login:
            post:
              # AI-assisted: see AI-ATTRIBUTION.md
              description: Verifies alias and password against the stored bcrypt hash, then persists a secure server-generated session. Returns success, message, public user DTO, token string, and server timestamp. Invalid credentials return HTTP 401. Required request fields must be nonblank strings; invalid input returns HTTP 400.
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LoginLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

          /lambda/register:
            post:
              # AI-assisted: see AI-ATTRIBUTION.md
              description: Registers using firstName, lastName, alias, password, imageStringBase64, and imageFileExtension without an existing token. Hashes passwords, uploads a PNG/JPEG/GIF/WebP photo to S3, atomically creates the account, and issues a persisted session. Returns success, message, public user DTO, token string, and server timestamp. Required strings must be nonblank; passwords must fit 72 UTF-8 bytes and images must be valid base64 with a matching signature and at most 3 MiB decoded. Invalid inputs or duplicate aliases return HTTP 400.
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RegisterLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

          /lambda/unfollow:
            post:
              description: Unfollows userAlias using token and returns success, message, followerCount, and followeeCount. Authenticates the stored session owner and atomically removes that owner's relationship and updates counters. Rejects self-unfollow and missing relationships; returns both target-user counts. Required request fields must be nonblank strings; invalid input returns HTTP 400.
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UnfollowLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

          /lambda/follow:
            post:
              description: Follows userAlias using token and returns success, message, followerCount, and followeeCount. Authenticates the stored session owner and atomically creates that owner's relationship and updates counters. Rejects self-follow and duplicate relationships; returns both target-user counts. Required request fields must be nonblank strings; invalid input returns HTTP 400.
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FollowLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

          /lambda/follow/is-following:
            post:
              description: Returns whether followerAlias follows followeeAlias. Accepts token, followerAlias, and followeeAlias; returns success, message, and a persisted boolean isFollowing. Authenticates the session and requires followerAlias to match its stored owner. Required request fields must be nonblank strings; invalid input returns HTTP 400.
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${IsFollowingLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

          /lambda/followees/list:
            post:
              description: Returns a page of users followed by the specified user. Requires nonblank token and userAlias strings, a positive integer pageSize, and an explicit lastItem (null or a complete user DTO with nonblank firstName, lastName, alias, and imageUrl). Invalid input returns HTTP 400. Authenticates the stored session; queries persisted relationships in alias order and resolves public user profiles. Page size is limited to 100.
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetFolloweesLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

          /lambda/followers/list:
            post:
              description: Returns a page of followers of the specified user, continuing after lastItem (null for the first page). Requires nonblank token and userAlias strings, a positive integer pageSize, and an explicit lastItem (null or a complete user DTO with nonblank firstName, lastName, alias, and imageUrl). Invalid input returns HTTP 400. Authenticates the stored session; queries persisted relationships in alias order and resolves public user profiles. Page size is limited to 100.
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetFollowersLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

          /lambda/followees/count:
            post:
              description: Returns the followee count for the specified user from stored counters after session authentication; absent legacy counters mean zero. Required request fields must be nonblank strings; invalid input returns HTTP 400.
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetFolloweeCountLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

          /lambda/followers/count:
            post:
              description: Returns the follower count for the specified user from stored counters after session authentication; absent legacy counters mean zero. Required request fields must be nonblank strings; invalid input returns HTTP 400.
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetFollowerCountLambda.Arn}/invocations
                requestTemplates: *commonRequestTemplates
                responses: *commonAmazonResponses
              responses: *commonSwaggerResponses

            #
            # TODO: ADD MORE ENDPOINT DEFINITIONS HERE
