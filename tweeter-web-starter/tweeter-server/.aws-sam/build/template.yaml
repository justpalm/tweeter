            post:
              description: Acknowledges posting using a token string and newStatus
                DTO containing post, nested user, and timestamp. Returns success and
                message. Milestone 3 does not persist the status, change feed or story
                data, or verify the session. Requires a nonblank token, nonblank post
                and nested user fields, and a finite nonnegative timestamp (zero is
                valid). Invalid input returns HTTP 400.
