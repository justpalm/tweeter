AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM config for Tweeter server
Parameters:
  FollowTableName:
    Type: String
    Default: follows
  FollowIndexName:
    Type: String
    Default: follows_index
Globals:
  Function:
    Runtime: nodejs24.x
    CodeUri: ./dist/
    Layers:
    - Ref: tweeterLayer
    Timeout: 30
    MemorySize: 128
    Environment:
      Variables:
        USER_TABLE_NAME:
          Ref: UserTable
        AUTH_TOKEN_TABLE_NAME:
          Ref: AuthTokenTable
        FOLLOW_TABLE_NAME:
          Ref: FollowTableName
        FOLLOW_INDEX_NAME:
          Ref: FollowIndexName
Metadata:
  x-common-policies:
  - AWSLambdaBasicExecutionRole
  - AmazonSESFullAccess
  - CloudWatchFullAccess
  - AmazonDynamoDBFullAccess
  - AmazonS3FullAccess
  - AmazonSQSFullAccess
  x-common-cors-headers:
    method.response.header.Access-Control-Allow-Origin: '''*'''
  x-common-swagger-response-headers:
    Access-Control-Allow-Origin:
      type: string
Resources:
