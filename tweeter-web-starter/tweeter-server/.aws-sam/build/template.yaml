AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM config for Tweeter server
Globals:
  Function:
    Runtime: nodejs24.x
    CodeUri: ./dist/
    Layers:
    - Ref: tweeterLayer
    Timeout: 30
    MemorySize: 128
    Environment:
      Variables:
        USER_TABLE_NAME:
          Ref: UserTable
        AUTH_TOKEN_TABLE_NAME:
          Ref: AuthTokenTable
Metadata:
  x-common-policies:
  - AWSLambdaBasicExecutionRole
  - AmazonSESFullAccess
  - CloudWatchFullAccess
  - AmazonDynamoDBFullAccess
  - AmazonS3FullAccess
  - AmazonSQSFullAccess
  x-common-cors-headers:
    method.response.header.Access-Control-Allow-Origin: '''*'''
  x-common-swagger-response-headers:
    Access-Control-Allow-Origin:
      type: string
Resources:
  tweeterApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: tweeterApi
      StageName: prod
      Cors:
        AllowMethods: '''GET,POST,PUT,DELETE'''
        AllowHeaders: '''*'''
        AllowOrigin: '''*'''
      DefinitionBody:
        swagger: '2.0'
        info:
          title: Tweeter API
          version: '1.0'
        x-common-consumes:
        - application/json
        x-common-produces:
        - application/json
        x-common-request-templates:
          application/json: $input.json('$')
        x-common-amazon-responses:
          default:
            statusCode: 200
            responseParameters:
              method.response.header.Access-Control-Allow-Origin: '''*'''
          .*bad-request.*:
            statusCode: 400
            responseParameters:
              method.response.header.Access-Control-Allow-Origin: '''*'''
            responseTemplates:
              application/json: '{ "error": "$input.path(''$.errorMessage'')" }'
          .*unauthorized.*:
            statusCode: 401
            responseParameters:
              method.response.header.Access-Control-Allow-Origin: '''*'''
            responseTemplates:
              application/json: '{ "error": "$input.path(''$.errorMessage'')" }'
          .*internal-server-error.*:
            statusCode: 500
            responseParameters:
              method.response.header.Access-Control-Allow-Origin: '''*'''
            responseTemplates:
              application/json: '{ "error": "$input.path(''$.errorMessage'')" }'
        x-common-swagger-responses:
          '200':
            description: OK
            headers:
              Access-Control-Allow-Origin:
                type: string
          '400':
            description: 'Invalid request input; returns an error message prefixed
              bad-request:'
            headers:
              Access-Control-Allow-Origin:
                type: string
          '401':
            description: Unauthorized
            headers:
              Access-Control-Allow-Origin:
                type: string
          '500':
